<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Attendance and Academic Performance Management System</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Student Attendance and Academic Performance Management System</h1><p>DevOps Lab Application</p></header><main><div id="message" role="status"></div><section class="panel"><h2>Faculty login</h2><input id="user" value="faculty"><input id="pass" type="password" value="faculty123"><button id="login">Login</button><small>Demo login: faculty / faculty123</small></section>
<section class="panel"><h2>Student registration</h2><input id="name" placeholder="Name"><input id="roll" placeholder="Roll number"><input id="dept" placeholder="Department"><input id="email" placeholder="Email"><button id="addStudent">Add student</button><div id="students"></div></section>
<section class="panel"><h2>Mark attendance</h2><input id="attendanceId" type="number" placeholder="Student record ID"><input id="date" type="date"><select id="status"><option>Present</option><option>Absent</option></select><button id="saveAttendance">Save attendance</button></section>
<section class="panel"><h2>Internal marks</h2><input id="marksId" type="number" placeholder="Student record ID"><input id="subject" placeholder="Subject"><input id="m1" type="number" min="0" max="100" placeholder="Internal 1"><input id="m2" type="number" min="0" max="100" placeholder="Internal 2"><button id="saveMarks">Save marks</button></section>
<section class="panel"><h2>Performance reports</h2><button id="report">Generate report</button><div id="reports"></div></section></main><footer>Node.js · Express · JSON storage</footer><script src="app.js"></script></body></html>
